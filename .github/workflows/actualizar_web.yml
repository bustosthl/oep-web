name: Actualizar Videos y Renderizar Quarto

on:
  schedule:
    - cron: '0 9 * * 1' # Se ejecuta automáticamente todos los lunes a las 9:00 AM
  workflow_dispatch: # Te permite ejecutarlo manualmente desde GitHub si lo necesitás

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para que el bot haga "commit" de los videos nuevos
      pages: write    # Permiso para actualizar la web
      
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes de R
        # Agregamos rvest y purrr para el nuevo script
        run: Rscript -e 'install.packages(c("tidyRSS", "dplyr", "yaml", "rvest", "purrr"))'

      - name: Ejecutar script de YouTube
        run: Rscript charlas/actualizar_videos.R # Ajustá la ruta si cambiaste la carpeta

      - name: Ejecutar script de Medios
        run: Rscript medios/actualizar_medios.R # Ajustá la ruta si lo guardaste en otra carpeta

      - name: Guardar los cambios (Commit automático)
        run: |
          git config --local user.name "GitHub Action Bot"
          git config --local user.email "action@github.com"
          # Le decimos a git que guarde todos los archivos .yml que hayan cambiado
          git add "**/*.yml"
          git commit -m "Actualización automática de videos y medios" || echo "No hay cambios para subir"
          git push

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar y publicar en GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}