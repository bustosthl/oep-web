name: Actualizar Videos/Medios y Renderizar Quarto

on:
  schedule:
    - cron: '0 9 * * 1' # Se ejecuta automáticamente todos los lunes a las 9:00 AM
  workflow_dispatch: # Te permite ejecutarlo manualmente desde GitHub si lo necesitás

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar paquetes de R
        run: Rscript -e 'install.packages(c("tidyRSS", "dplyr", "yaml", "rvest", "purrr", "httr"))'

      - name: Ejecutar script de YouTube
        run: Rscript charlas/actualizar_videos.R

      - name: Ejecutar script de Medios
        run: Rscript medios/actualizar_medios.R

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar el sitio
        uses: quarto-dev/quarto-actions/render@v2

      - name: Guardar los cambios (Commit automático)
        run: |
          git config --local user.name "GitHub Action Bot"
          git config --local user.email "action@github.com"
          git add charlas/videos.yml medios/medios.yml docs/
          git commit -m "Actualización automática de videos, medios y sitio" || echo "No hay cambios para subir"
          git push
